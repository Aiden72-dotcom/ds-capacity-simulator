function simulate(){readGlobal();const g=state.g,H=g.years*365,P=state.products.map((p,i)=>{const bpc=Math.max(1,p.bpc|0),target=p.demandMode==='batches'?Math.max(0,p.demandValue|0):p.demandMode==='campaigns'?Math.max(0,p.demandValue|0)*bpc:Infinity;return Object.assign({},p,{idx:i,bpc,target,remB:target,madeB:0,campList:[]})}),LS=state.lines.map((L,li)=>{const nU=Math.max(1,L.nUSP|0),nD=Math.max(1,L.nDSP|0);return{L,li,nU,nD,batches:[],brBlocks:[],coBlocks:[],campaigns:[],dspLast:Array(nD).fill(-1e9),dspCount:Array(nD).fill(0),suites:Array.from({length:nU},(_,k)=>({k,pbrReq:L.startDay,rmStart:null,flaStart:null,first:true,done:false})),lastHarvest:-1e9,lastPcoEnd:null,curProd:null,ready:Math.max(1,L.startDay|0),rr:0,blocked:new Set(),seedRuns:[],dDSP:0,dCad:0,dSeed:0,done:false}}),campaigns=[];let seq=0,guard=0;while(guard++<3000){let ls=null;for(const x of LS)if(!x.done&&(ls===null||x.ready<ls.ready))ls=x;if(!ls)break;const p=pickProduct(ls,P);if(!p){ls.done=true;continue}const kind=ls.lastPcoEnd===null?'최초 착수':ls.curProd===p.id?'연속 운전':'제품 전환',prevPco=ls.lastPcoEnd,c=runCampaign(ls,p,g,H);if(c.n===0){ls.blocked.add(p.id);continue}seq++;p.campList.push({seq,n:c.n,line:ls.li});if(p.remB!==Infinity)p.remB-=c.n;p.madeB+=c.n;const pcoEnd=Math.max(...c.batches.map(b=>b.turnEnd)),rec={seq,pcn:p.campList.length,pid:p.id,product:p.name,pidx:p.idx,li:ls.li,line:ls.L.name,kind,prevPco,n:c.n,bpc:p.bpc,start:Math.min(...c.batches.map(b=>b.flaStart!=null?b.flaStart:b.rmStart)),rm:Math.min(...c.batches.map(b=>b.rmStart)),firstH:Math.min(...c.batches.map(b=>b.harvest)),lastH:Math.max(...c.batches.map(b=>b.harvest)),dspEnd:Math.max(...c.batches.map(b=>b.dspEnd)),pcoEnd,batches:c.batches};campaigns.push(rec);ls.campaigns.push(rec);c.batches.forEach(b=>{b.camp=seq;b.pcn=rec.pcn});ls.curProd=p.id;ls.lastPcoEnd=pcoEnd;ls.ready=pcoEnd+1;ls.blocked.clear();if(ls.ready>H)ls.done=true}const all=[];LS.forEach(ls=>all.push(...ls.batches));P.forEach(p=>all.filter(b=>b.pid===p.id).sort((a,b)   }
}
